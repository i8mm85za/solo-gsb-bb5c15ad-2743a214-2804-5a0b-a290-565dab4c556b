services:
  app:
    build: .
    image: argument-stability-sandbox:latest
    container_name: argument-stability-sandbox
    ports:
      - "4000:4000"
    volumes:
      - sandbox-data:/app/data
    environment:
      # 宿主机/其他端口映射只需改左侧；应用内部端口可在此覆盖
      PORT: "4000"
      DB_PATH: /app/data/sandbox.db
    restart: unless-stopped

volumes:
  sandbox-data:
